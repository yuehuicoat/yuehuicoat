<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" aria-label="Friendly bear service agent">
  <defs>
    <linearGradient id="bear-fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a87a4a"/>
      <stop offset="100%" stop-color="#7a5430"/>
    </linearGradient>
  </defs>
  <!-- body -->
  <ellipse cx="100" cy="138" rx="54" ry="46" fill="url(#bear-fur)"/>
  <ellipse cx="100" cy="146" rx="30" ry="28" fill="#e8c89a"/>
  <!-- arms holding tools -->
  <ellipse cx="62" cy="140" rx="14" ry="18" fill="url(#bear-fur)" transform="rotate(-20 62 140)"/>
  <ellipse cx="138" cy="140" rx="14" ry="18" fill="url(#bear-fur)" transform="rotate(20 138 140)"/>
  <!-- legs -->
  <ellipse cx="80" cy="178" rx="14" ry="10" fill="url(#bear-fur)"/>
  <ellipse cx="120" cy="178" rx="14" ry="10" fill="url(#bear-fur)"/>
  <ellipse cx="80" cy="180" rx="6" ry="4" fill="#e8c89a"/>
  <ellipse cx="120" cy="180" rx="6" ry="4" fill="#e8c89a"/>
  <!-- head -->
  <circle cx="100" cy="80" r="44" fill="url(#bear-fur)"/>
  <!-- ears -->
  <circle cx="68" cy="50" r="12" fill="url(#bear-fur)"/>
  <circle cx="132" cy="50" r="12" fill="url(#bear-fur)"/>
  <circle cx="68" cy="50" r="6" fill="#e8c89a"/>
  <circle cx="132" cy="50" r="6" fill="#e8c89a"/>
  <!-- snout -->
  <ellipse cx="100" cy="96" rx="22" ry="16" fill="#e8c89a"/>
  <ellipse cx="100" cy="86" rx="6" ry="4" fill="#1a1a1a"/>
  <path d="M100 90 L 100 96" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M100 96 Q 92 100 88 96" stroke="#1a1a1a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M100 96 Q 108 100 112 96" stroke="#1a1a1a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="84" cy="76" r="4" fill="#1a1a1a"/>
  <circle cx="116" cy="76" r="4" fill="#1a1a1a"/>
  <circle cx="85" cy="74" r="1.4" fill="#fff"/>
  <circle cx="117" cy="74" r="1.4" fill="#fff"/>
  <!-- headset -->
  <path d="M64 60 Q 100 30 136 60" stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="60" cy="74" rx="8" ry="10" fill="#d4a857"/>
  <ellipse cx="140" cy="74" rx="8" ry="10" fill="#d4a857"/>
  <path d="M60 84 Q 60 100 76 100" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="76" cy="102" r="4" fill="#d4a857"/>
</svg>
