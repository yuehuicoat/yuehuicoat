<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" aria-label="Penguin trade specialist">
  <defs>
    <linearGradient id="peng-belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e4dc"/>
    </linearGradient>
  </defs>
  <!-- body -->
  <ellipse cx="100" cy="120" rx="48" ry="60" fill="#1a1a1a"/>
  <ellipse cx="100" cy="130" rx="32" ry="48" fill="url(#peng-belly)"/>
  <!-- wings -->
  <ellipse cx="56" cy="120" rx="12" ry="32" fill="#0a0a0c" transform="rotate(-12 56 120)"/>
  <ellipse cx="144" cy="120" rx="12" ry="32" fill="#0a0a0c" transform="rotate(12 144 120)"/>
  <!-- feet -->
  <path d="M82 178 L 96 178 L 96 184 L 78 184 Z" fill="#d4a857"/>
  <path d="M104 178 L 118 178 L 122 184 L 104 184 Z" fill="#d4a857"/>
  <!-- head -->
  <circle cx="100" cy="68" r="36" fill="#1a1a1a"/>
  <!-- face white -->
  <ellipse cx="100" cy="76" rx="20" ry="22" fill="#fff"/>
  <!-- eyes -->
  <circle cx="90" cy="62" r="5" fill="#fff"/>
  <circle cx="110" cy="62" r="5" fill="#fff"/>
  <circle cx="91" cy="63" r="2.4" fill="#1a1a1a"/>
  <circle cx="111" cy="63" r="2.4" fill="#1a1a1a"/>
  <!-- beak -->
  <path d="M92 78 L 108 78 L 100 90 Z" fill="#d4a857"/>
  <path d="M92 78 L 108 78" stroke="#a98134" stroke-width="0.8"/>
  <!-- tie -->
  <path d="M100 96 L 96 104 L 100 110 L 96 124 L 100 140 L 104 124 L 100 110 L 104 104 Z" fill="#d4a857"/>
  <!-- tiny clipboard -->
  <g transform="translate(40 90)">
    <rect x="0" y="0" width="22" height="28" rx="2" fill="#f4e4c4"/>
    <rect x="6" y="-3" width="10" height="6" rx="1" fill="#8a5a2c"/>
    <path d="M4 8 L 18 8 M 4 12 L 18 12 M 4 16 L 14 16" stroke="#5a3a2a" stroke-width="0.8"/>
  </g>
</svg>
