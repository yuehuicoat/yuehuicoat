<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0e12"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.7" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#d4a857" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d4a857" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H 0 V 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg1)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#spot)"/>
  <!-- abstract coating plume shapes -->
  <g opacity="0.3">
    <path d="M-50 600 C 200 580, 350 540, 500 580 C 700 630, 900 580, 1250 540 L 1250 800 L -50 800 Z" fill="#0a0a0c"/>
    <path d="M-50 680 C 200 660, 350 620, 500 660 C 700 710, 900 660, 1250 620 L 1250 800 L -50 800 Z" fill="#07070a"/>
  </g>
  <!-- geometric highlights -->
  <g opacity="0.4">
    <line x1="800" y1="0" x2="1200" y2="200" stroke="#d4a857" stroke-width="1"/>
    <line x1="900" y1="0" x2="1200" y2="100" stroke="#d4a857" stroke-width="0.5" opacity="0.6"/>
    <line x1="1000" y1="0" x2="1200" y2="40" stroke="#d4a857" stroke-width="0.5" opacity="0.4"/>
  </g>
  <!-- subtle dots -->
  <g fill="#d4a857" opacity="0.6">
    <circle cx="100" cy="100" r="1.2"/>
    <circle cx="200" cy="160" r="1.2"/>
    <circle cx="320" cy="120" r="1.2"/>
    <circle cx="460" cy="180" r="1.2"/>
    <circle cx="600" cy="140" r="1.2"/>
    <circle cx="740" cy="200" r="1.2"/>
    <circle cx="880" cy="120" r="1.2"/>
  </g>
</svg>
